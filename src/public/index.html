<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RouteCut | URL Shortener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-header">
        <h1 class="card-title">RouteCut</h1>
        <p class="card-description">Paste your long URL below to create a concise, shareable short link.</p>
      </div>
      <div class="card-content">
        <form class="url-form">
          <div class="input-group">
            <input class="url-input" type="url" placeholder="https://example.com/very-long-link" required autofocus>
            <button type="submit" class="btn btn-primary">
              Shorten
            </button>
          </div>
        </form>
        <div id="result-container" class="result-container hidden">
          <p class="result-label">Your short link is ready:</p>
          <div class="result-box">
            <a href="#" target="_blank" rel="noopener" class="short-url" id="short-url"></a>
            <button type="button" class="btn btn-icon btn-secondary" id="copy-btn" aria-label="Copy link">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="main.js"></script>
</body>
</html>
